name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Set this to local `bun --version`.
  BUN_VERSION: "1.3.14"

jobs:
  api:
    name: API — typecheck + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pettr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pettr_test
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/api
        run: bunx tsc --noEmit
      - name: Migrate test database
        working-directory: apps/api
        run: bun run test:db:migrate
      - name: Run tests
        working-directory: apps/api
        run: bun run test:ci

  web:
    name: Web — typecheck + tests
    runs-on: ubuntu-latest
    # Assumes src/routeTree.gen.ts is committed (un-ignored).
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/web
        run: bunx tsc --noEmit
      - name: Run tests
        working-directory: apps/web
        run: bun run test:run

  shared:
    name: Shared — typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: packages/shared
        run: bunx tsc --noEmit
      - name: Run tests
        working-directory: packages/shared
        run: bun run test:run

  deploy-staging:
    name: Deploy — staging
    needs: [api, web, shared]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/pettr/staging

            # Deterministic sync to the pushed commit (no local merge on the box).
            git fetch --prune origin staging
            git reset --hard origin/staging

            # Frozen install across the workspace.
            bun install --frozen-lockfile

            # Gated migration. APP_ENV is a literal here (matches the unit); DATABASE_URL
            # + NODE_ENV come from the env file. The guard refuses a wrong-project URL.
            set -a
            . /etc/pettr/staging.env
            set +a
            ( cd apps/api && APP_ENV=staging bun run db:migrate )

            # Restart via the single scoped sudo command (see sudoers snippet in DEPLOY.md).
            sudo systemctl restart pettr-api-staging

            # Health-check the real process on loopback; dump logs and fail if it didn't come up.
            for i in 1 2 3 4 5; do
              if curl -fsS http://127.0.0.1:3002/api/ready >/dev/null; then
                echo "staging /api/ready OK"; exit 0
              fi
              sleep 3
            done
            echo "staging did not become ready:"; journalctl -u pettr-api-staging -n 60 --no-pager; exit 1

  deploy-prod:
    name: Deploy — prod
    needs: [api, web, shared]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/pettr/prod

            # Deterministic sync to the pushed commit (no local merge on the box).
            git fetch --prune origin main
            git reset --hard origin/main

            # Frozen install across the workspace.
            bun install --frozen-lockfile

            # Gated migration. APP_ENV is a literal here (matches the unit); DATABASE_URL
            # + NODE_ENV come from the env file. The guard refuses a wrong-project URL.
            set -a
            . /etc/pettr/prod.env
            set +a
            ( cd apps/api && APP_ENV=production bun run db:migrate )

            # Restart via the single scoped sudo command (see sudoers snippet in DEPLOY.md).
            sudo systemctl restart pettr-api-prod

            # Health-check the real process on loopback; dump logs and fail if it didn't come up.
            for i in 1 2 3 4 5; do
              if curl -fsS http://127.0.0.1:3001/api/ready >/dev/null; then
                echo "prod /api/ready OK"; exit 0
              fi
              sleep 3
            done
            echo "prod did not become ready:"; journalctl -u pettr-api-prod -n 60 --no-pager; exit 1